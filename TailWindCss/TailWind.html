<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./src/output.css">
    <title>Profile</title>
    <link rel="shortcut icon" href="man.png" type="image/x-icon">

</head>

<body class="flex justify-center items-center mt-10 bg-blue-200">
    <main class="w-80 hover:scale-105 transition-transform ease-in-out   ">
        <div class="flex drop-shadow-lg justify-center bg-linear-to-r from-cyan-50 via-blue-500 to-indigo-600 h-28 rounded-2xl">
            <img src="man.png" alt="profile" class="w-25 h-25 rounded-full border-4 border-blue-600">
        </div>
        <!-- profile content  -->
        <div class="text-center p-5">
            <h2 class="font-bold  text-xl">Rohit Kumar</h2>
            <p class="text-gray-500 text-sm">Front End Developer</p>
            <p class="text-gray-500 text-sm mt-3">Passionate about building clean UI and smooth user experiences.</p>
        </div>

        <!-- skills -->
        <div class="text-center">
            <span class="bg-indigo-300 text-indigo-600 text-xs px-3 py-1 rounded-full">HTML</span>
            <span class="bg-indigo-300 text-indigo-600 text-xs px-3 py-1 rounded-full">JavaScript</span>
            <span class="bg-indigo-300 text-indigo-600 text-xs px-3 py-1 rounded-full">TailWind</span>
        </div>

        <hr class="mt-2 text-blue-800">

        <div class="flex justify-around mt-4 gap-4  pt-4 text-center">

            <div>
                <p class="font-bold  ">5.5K</p>
                <p class="text-xs text-gray-500">Followers</p>
            </div>

            <div>
                <p class="font-bold  ">45</p>
                <p class="text-xs text-gray-500">Projects</p>
            </div>

            <div>
                <p class="font-bold  ">5.0</p>
                <p class="text-xs text-gray-500">Rating</p>
            </div>

        </div>

        <div class="flex gap-3 mt-5 justify-center">
            <button class="bg-indigo-700 text-white py-2 px-5 rounded-lg hover:bg-amber-600">Follow</button>
            <button class=" border border-blue-700  text-indigo-700 py-2 px-4 rounded-lg hover:bg-red-400">Message</button>
        </div>


    </main>
</body>

</html>
